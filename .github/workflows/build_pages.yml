name: Deploy to GitHub Pages

# No `push` trigger: the build workflows' own export commit is a push to main,
# so it would fire a second, duplicate deploy alongside the `workflow_run` one.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and commit export files
      - Build and commit NFL export files
    types:
      - completed


permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # `types: [completed]` fires on failure and cancellation too; only deploy
    # what actually built.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages branch
        uses: actions/checkout@v7
        with:
          ref: pages
      - name: Checkout main branch into _data
        uses: actions/checkout@v7
        with:
          ref: main
          path: _data
      - name: Mirror data into public/
        run: cp -r _data/exports public/
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm install
      - name: Build Astro Site
        run: npm run build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id : deployment
        uses: actions/deploy-pages@v5